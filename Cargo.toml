[package]
name = "SigmaOS-rebuilderd-website"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "SigmaOS rebuilderd_website component"

[lib]
name = "rebuilderd_website"
path = "src/lib.rs"

[dependencies]
thiserror = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
